server:
  port: ${PORT:8080}

spring:
  application:
    name: qr-wait-backend

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/qr_wait}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
      connection-timeout: 20000

  jpa:
    open-in-view: false
    hibernate:
      # Flyway chiu trach nhiem tao/sua bang, Hibernate chi doi chieu (validate)
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 2MB
      max-request-size: 2MB

app:
  jwt:
    secret: ${JWT_SECRET:qrwait-dev-secret-key-please-change-in-production-min-32-chars}
    access-expiration-ms: 3600000      # 1 gio
    refresh-expiration-ms: 2592000000  # 30 ngay
  cors:
    allowed-origins: ${FRONTEND_URL:http://localhost:5173}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  storage:
    base-url: ${STORAGE_BASE_URL:http://localhost:8080/uploads}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
