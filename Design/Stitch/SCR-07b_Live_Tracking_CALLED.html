<!-- Minimal Header -->
<header class="flex flex-col items-center text-center gap-1.5">
<div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-surface-container-high text-on-surface-variant text-xs font-medium shadow-sm">
<span class="w-2 h-2 rounded-full bg-primary animate-pulse"></span>
<span>QR-Wait Queue • Chi nhánh Quận 1</span>
</div>
<p class="text-[11px] font-semibold tracking-wider uppercase text-on-surface-variant">
      HÀNG CHỜ BÀN 1-4 NGƯỜI
    </p>
</header>
<!-- Main CALLED Card (Emerald Green Theme) -->
<section class="relative overflow-hidden rounded-xl bg-gradient-to-br from-[#10B981] to-[#059669] text-on-primary shadow-xl px-5 py-7 flex flex-col items-center text-center gap-5" id="called-card">

<div class="pointer-events-none absolute -top-12 -right-12 w-40 h-40 rounded-full bg-on-primary/10"></div>
<div class="pointer-events-none absolute -bottom-16 -left-10 w-44 h-44 rounded-full bg-on-primary/10"></div>
<!-- Ringing Bell Icon -->
<div class="relative flex items-center justify-center">
<div class="absolute w-20 h-20 rounded-full bg-on-primary/20 animate-ping"></div>
<div class="relative w-16 h-16 rounded-full bg-on-primary/25 backdrop-blur-sm flex items-center justify-center shadow-md">
<span class="material-symbols-outlined text-on-primary text-4xl animate-bounce" id="bell-icon" style="font-variation-settings: 'FILL' 1, 'wght' 600;">
          notifications_active
        </span>
</div>
</div>
<!-- Bold Headline -->
<div class="flex flex-col gap-1">
<h1 class="font-headline font-black text-3xl tracking-tight text-on-primary drop-shadow-sm">
        TỚI LƯỢT BẠN!
      </h1>
<p class="text-sm font-medium text-on-primary/90">
        Đã đến lượt phục vụ của bạn
      </p>
</div>
<!-- Ticket Number & Counter Instruction -->
<div class="w-full rounded-xl bg-on-primary/15 backdrop-blur-sm px-4 py-5 flex flex-col items-center gap-2 shadow-inner">
<span class="text-xs font-semibold uppercase tracking-widest text-on-primary/85">
        Số vé của bạn
      </span>
<div class="font-headline font-black text-6xl tracking-tight text-on-primary leading-none">
        #A-025
      </div>
<div class="mt-2 inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full bg-on-primary text-[#059669] font-bold text-sm shadow-sm">
<span class="material-symbols-outlined text-base" style="font-variation-settings: 'FILL' 1;">
          storefront
        </span>
<span>VUI LÒNG ĐẾN QUẦY 01</span>
</div>
</div>
<!-- Primary Confirmation Button -->
<div class="w-full flex flex-col items-center gap-3 mt-1">
<button class="w-full min-h-[56px] px-6 py-3.5 rounded-xl bg-on-primary text-[#059669] font-headline font-extrabold text-lg tracking-wide shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer" id="confirm-btn" type="button">
<span class="material-symbols-outlined text-2xl" style="font-variation-settings: 'FILL' 1;">
          directions_walk
        </span>
<span id="confirm-btn-text">TÔI ĐANG ĐẾN</span>
</button>
<p class="text-xs leading-relaxed text-on-primary/90 max-w-[290px]" id="confirm-hint">
        Đã thông báo tới nhân viên khi bạn bấm nút. Vui lòng xuất trình màn hình này tại quầy.
      </p>
</div>
</section>
<!-- Minimal Footer -->
<footer class="pt-1 pb-2 text-center">
<p class="text-xs text-on-surface-variant font-medium">
      Hệ thống xếp hàng tự động QR-Wait
    </p>
</footer>
</div>
<script>
  (function () {
    const btn = document.getElementById('confirm-btn');
    const btnText = document.getElementById('confirm-btn-text');
    const hint = document.getElementById('confirm-hint');
    if (!btn || !btnText || !hint) return;

    btn.addEventListener('click', function () {
      btnText.textContent = 'ĐÃ XÁC NHẬN ĐANG ĐẾN';
      btn.classList.remove('bg-on-primary', 'text-[#059669]');
      btn.classList.add('bg-[#064E3B]', 'text-on-primary');
      hint.textContent = 'Nhân viên tại Quầy 01 đã nhận được thông báo. Hẹn gặp bạn ngay!';
    });
  })();
</script></main></body></html>
